name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  epub:
    name: EPUB
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install pandoc
        run: brew install pandoc

      - name: Download BIPs
        run: make setup

      - name: Build EPUB
        run: make epub

      - name: Upload EPUB
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-bips-book.epub
          path: bitcoin-bips-book.epub

  pdf:
    name: PDF
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew update
          brew install pandoc
          brew install --cask basictex
          eval "$(/usr/libexec/path_helper)"
          export PATH="/Library/TeX/texbin:$PATH"
          sudo tlmgr update --self
          sudo tlmgr install soul xcolor

      - name: Download BIPs
        run: make setup

      - name: Build PDF
        timeout-minutes: 5
        continue-on-error: true
        run: |
          export PATH="/Library/TeX/texbin:$PATH"
          make pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-bips-book.pdf
          path: bitcoin-bips-book.pdf
          if-no-files-found: warn
